name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Spec snapshot was not edited by hand
        if: matrix.node == 22
        run: npm run check:spec
      - name: Generated types match the spec
        if: matrix.node == 22
        run: npm run check:drift
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: SDK requests match the spec (Prism contract tests)
        if: matrix.node == 22
        run: npm run test:contract
      - run: npm run build
